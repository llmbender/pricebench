[project]
name = "pricebench"
version = "1.0.0"
description = "PriceBench — a two-track benchmark for AI shopping-search agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "curl-cffi>=0.7",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pricebench"]
